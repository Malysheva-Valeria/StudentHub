<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Відвідуваність · StudentHub</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="page" class="hidden">
<div class="page-head">
    <div><h1>Відвідуваність</h1><p>Відмітка присутності на заняттях</p></div>
</div>
<div class="card">
    <div class="filters">
        <div class="f"><label for="aGroup">Група</label><select id="aGroup"></select></div>
        <div class="f grow"><label for="aSubject">Дисципліна</label><select id="aSubject"></select></div>
        <div class="f"><label for="aDate">Дата заняття</label><input id="aDate" type="date"></div>
    </div>
    <div class="stats-row hidden" id="sheetStats"></div>
    <div id="sheet"><div class="table-empty">Оберіть групу, дисципліну та дату</div></div>
</div>
</div>
<script src="/js/app.js"></script>
<script src="/js/pages/attendance.js"></script>
</body>
</html>
